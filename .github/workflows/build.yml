name: Build Class 6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project folder
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f AzmoonyarAhmadiAndroid/settings.gradle ]; then
            echo "PROJECT_DIR=AzmoonyarAhmadiAndroid" >> $GITHUB_ENV
          else
            echo "Project not found"
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelas-sheshom-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
